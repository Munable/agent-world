[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-world"
version = "0.24.0"
description = "Persistent worlds for people and agents."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
agent-world = "agent_world.application:main"
agent-world-connect = "agent_world.connect:main"
agent-world-grove = "agent_world.grove_app:main"
agent-world-play = "agent_world.grove_connector:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["agent_world*", "examples*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
agent_world = ["web/*.html", "web/*.css", "web/*.js", "grove_web/*.html", "grove_web/*.css", "grove_web/*.js"]
examples = ["river_camp_web/*.html", "river_camp_web/*.css", "river_camp_web/*.js", "dnd_web/*.html", "dnd_web/*.css", "dnd_web/*.js", "frontier_web/*.html", "frontier_web/*.css", "frontier_web/*.js"]

[tool.ruff]
line-length = 110
target-version = "py311"
